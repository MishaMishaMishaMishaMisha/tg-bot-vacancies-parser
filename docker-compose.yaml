name: tg-bot-vacancies


services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: container-app
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: watchfiles --filter python "uv run python -m src.main" src
    # command: >
      # sh -c "uv run alembic upgrade head &&
      #        uv run python -m src.main"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: container-postgres
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data_:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data_: