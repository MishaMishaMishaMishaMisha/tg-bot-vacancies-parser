[project]
name = "tg-bot-vacancies-parser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-env>=1.8.5",
    "sqlalchemy[asyncio]>=2.1.8",
    "watchfiles>=1.3.0",
]


[tool.mypy]
plugins = ["pydantic.mypy"]
