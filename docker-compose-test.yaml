name: testing-tg-bot-vacancies

services:

  postgres_test:
    image: postgres:17-alpine
    container_name: test-container-postgres
    env_file: .test.env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
